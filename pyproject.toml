[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "futu-opend-mcp"
version = "0.1.3"
description = "MCP server exposing Futu OpenD read-only investment-research quote APIs."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "eli" }]
keywords = ["futu", "opend", "mcp", "stock", "finance"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
]
dependencies = [
  "futu-api>=10.5.6508",
  "mcp>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.5"]

[project.scripts]
futu-opend-mcp = "futu_opend_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/futu_opend_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: needs a live OpenD gateway"]

[tool.ruff]
extend-exclude = ["src/futu_opend_mcp/_skill"]
line-length = 100

[tool.ruff.lint]
# Pin the rule set so future ruff upgrades cannot pull in new default rules
# (SIM/UP/C408/BLE/S/RUF) and break CI. E/F/W match the stable defaults this
# project was written against; I keeps import sorting meaningful.
select = ["E", "F", "W", "I"]
# E402 disabled: tool modules intentionally import after _base for side effects.
# E501 disabled: codebase line lengths already exceed 100 throughout; enforcing
# would require touching every tools file for no behaviour gain.
# E702 disabled: compact `cap = {}; _patch(...)` test setup lines are intentional.
ignore = ["E402", "E501", "E702"]
